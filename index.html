<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="きょう">
<meta name="theme-color" content="#F5EFEB">
<meta name="description" content="ひび手帳のタイムラインの「今日」だけを表示します">
<title>きょう｜ひび手帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* ひび手帳と同じ色で、テーマカラーはひび手帳のブルー。Structured のように、色つきのカプセルを縦の線でつないで1日を並べる */
:root{
  --bg:#F5EFEB; --surface:#FFFFFF; --surface-2:#FAF6F3; --ink:#232A5C; --ink-2:#6D7092; --ink-3:#A9AABD;
  --line:#E2D9D2; --accent:#4F8ED6; --sun:#D45850; --overlay:rgba(24,26,48,.32); --shadow:0 6px 22px rgba(35,42,92,.08);
  --f-body:ui-rounded,"SF Pro Rounded","Hiragino Sans","Zen Maru Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#252526; --surface-2:#1C1C1D; --ink:#F2F1F4; --ink-2:#A3A3AD; --ink-3:#66666F;
    --line:#3A3A3F; --accent:#6FA8E8; --sun:#F07D74; --overlay:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#252526; --surface-2:#1C1C1D; --ink:#F2F1F4; --ink-2:#A3A3AD; --ink-3:#66666F;
  --line:#3A3A3F; --accent:#6FA8E8; --sun:#F07D74; --overlay:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink)}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
@media (hover:none){button:not(:disabled):active{opacity:.55}}

#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.hd .d{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.hd h1{margin:0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:.01em}
.hd .hol{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--sun);vertical-align:3px}
.hd-btns{display:flex;gap:2px;margin-top:4px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.icon-btn.spin .ico{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sum{display:flex;align-items:center;gap:12px;margin:10px 0 16px;padding:12px 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.ring{flex:none;width:44px;height:44px}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.sum b{display:block;font-size:15px}
.sum small{display:block;font-size:12.5px;color:var(--ink-2)}

/* all-day chips */
.ad{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:flex;align-items:center;gap:7px;max-width:100%;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.chip .c{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.chip .c .ico{width:15px;height:15px;stroke-width:2.1}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.over{color:var(--sun)}

/* timeline */
.tl{position:relative}
.row{position:relative;display:grid;grid-template-columns:52px 64px minmax(0,1fr);align-items:center;column-gap:6px;padding:0}
.row .t{align-self:start;padding:6px 4px 0 0;text-align:right;font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25}
.rail{position:relative;align-self:stretch;display:flex;justify-content:center;align-items:flex-start}
/* the line joining the items: each item's own color, fading into the next one's between them */
/* Structured-style links (same as ひび手帳): dotted, centred on the pills, fading from one item's color into the next (drawn by drawLinks) */
.tl-links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.tl-links .tl-near{stroke:color-mix(in srgb,var(--ink-3) 55%,var(--surface))}
.row.it{padding:6px 0}
.row.it .rail{align-items:center}
.pill{position:relative;z-index:1;width:58px;border-radius:29px;background:var(--c);color:#fff;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 3px 10px color-mix(in srgb,var(--c) 35%,transparent)}
.pill .ico{position:relative;z-index:1;width:26px;height:26px;stroke-width:2}
/* now inside this item: the part still to come is paler */
.pill .rest{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.5)}
.body{display:block;min-width:0;padding:4px 0}
.body .m{display:block;font-size:12.5px;color:var(--ink-2)}
.body .tt{display:block;font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row.done .tt{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:2px;background:var(--surface-2);color:var(--ink-2)}
.tag.now{background:var(--accent);color:#fff}
.tag.rt{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tag .ico{display:inline-block;width:11px;height:11px;stroke-width:2.4;vertical-align:-1px;margin-right:2px}
/* free time between items */
.row.gap .body{font-size:12px;color:var(--ink-3);padding:6px 0}
/* the now line */
.row.now{padding:2px 0}
.row.now .t{padding-top:0;align-self:center;color:var(--accent);font-weight:700}
.row.now .dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--accent);margin:auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.row.now .rail{align-items:center}
.row.now .ln{grid-column:3/-1;height:2px;border-radius:1px;background:var(--accent)}
.empty{text-align:center;color:var(--ink-2);padding:44px 12px;line-height:1.8}
.empty .ico{width:40px;height:40px;margin:0 auto 10px;color:var(--ink-3)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--ink-3)}
.foot.err{color:var(--sun)}

/* first screen (not connected yet) */
.hello{padding:30px 6px;text-align:center}
.hello .logo{width:84px;height:84px;border-radius:22px;margin:10px auto 18px;box-shadow:var(--shadow)}
.hello h2{margin:0 0 8px;font-size:22px}
.hello p{margin:0 0 20px;color:var(--ink-2);font-size:14px;line-height:1.8}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--surface);box-shadow:var(--shadow);margin-top:10px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.7;text-align:left}

/* bottom sheet */
.ov{position:fixed;inset:0;z-index:10;background:var(--overlay);opacity:0;transition:opacity .25s}
.ov.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sh-bar{display:flex;justify-content:flex-end;padding:12px 14px 0}
.sh-bar button{font-weight:700;color:var(--accent);padding:4px 6px}
.sh-in{padding:0 18px}
.dt-head{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.dt-head .pill{width:56px;height:56px;border-radius:28px;flex:none}
.dt-head .pill .ico{width:26px;height:26px}
.dt-head b{display:block;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
.dt-head small{display:block;color:var(--ink-2);font-size:13.5px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:4px 14px;margin-bottom:12px}
.li{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border-bottom:0}
.li>.ico{flex:none;width:20px;height:20px;color:var(--ink-2);margin-top:1px}
.li span{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.li.on{color:var(--ink-3);text-decoration:line-through}
.li .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;color:#fff;margin-top:1px}
.li .box .ico{width:13px;height:13px;stroke-width:3}
.li.on .box{background:var(--c)}
.li:not(.on) .box .ico{display:none}
.lbl{font-size:12px;font-weight:700;color:var(--ink-2);margin:16px 4px 6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;font-size:14.5px;font-weight:600}
.tg small{display:block;font-size:12px;font-weight:400;color:var(--ink-2);margin-top:2px}
.tg input{flex:none;width:22px;height:22px;accent-color:var(--accent)}
.fld input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}

.rt-sum{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.rt-sum .od{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;flex-wrap:wrap}
.rt-sum .od .ico{width:18px;height:18px;color:var(--ink-3)}
.rt-sum .tm{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.rt-sum .mt{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.rt-tags{display:flex;gap:6px;margin-top:8px}
.rt-tags span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:var(--c)}
.rt-steps{list-style:none;margin:0;padding:6px 16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.rt-steps li{display:grid;grid-template-columns:48px 18px minmax(0,1fr);gap:10px;align-items:stretch}
.rt-steps .t{font-size:12.5px;text-align:right;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.rt-steps .t b{font-size:14.5px;color:var(--ink)}
.rt-steps .mk{position:relative;display:flex;justify-content:center}
.rt-steps .st .mk::after{content:"";align-self:center;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);z-index:1}
.rt-steps .st.first .mk::after,.rt-steps .st.last .mk::after{border-color:var(--accent);background:var(--accent)}
.rt-steps .st .nm{font-size:16px;font-weight:700;padding:12px 0;align-self:center}
.rt-steps .ac .mk::before{content:"";width:6px;border-radius:3px;background:var(--c,var(--accent))}
.rt-steps .ac.walk .mk::before{width:0;border-left:4px dotted var(--ink-3);background:none}
.rt-steps .ac .bd{padding:6px 0 10px;font-size:13px;color:var(--ink-2)}
.rt-steps .ac .ln{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.rt-steps .ac .ln::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.rt-steps .ac.walk .ln::before{display:none}
.rt-steps details{margin-top:4px}
.rt-steps summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px}
.rt-steps details ul{list-style:none;padding:0;margin:4px 0 0}
.rt-steps details li{display:flex;gap:10px;font-size:12.5px;padding:2px 0}
/* launch animation: the icon's sunrise plays on the blue, then the app shows (like ひび手帳's "h") */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#4F8ED6;transition:opacity .45s ease,transform .5s cubic-bezier(.3,.8,.3,1)}
#splash svg{width:min(60vw,270px);height:auto;overflow:visible}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-cr{stroke:#FFF4EE;stroke-width:20;stroke-linecap:round;fill:none}
.sp-hz{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:spGrow .5s cubic-bezier(.5,0,.2,1) .1s forwards}
.sp-sun{fill:#FFF4EE;transform:translateY(130px);animation:spRise .7s cubic-bezier(.2,.8,.25,1) .3s forwards}
.sp-ray{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .28s ease-out forwards}
.sp-low{opacity:.55;transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:spGrow .35s cubic-bezier(.5,0,.2,1) 1.08s forwards}
.sp-dot{fill:#232A5C;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spDot .45s cubic-bezier(.3,1.7,.5,1) 1.3s forwards}
@keyframes spGrow{to{transform:scaleX(1)}}
@keyframes spRise{to{transform:none}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spDot{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.sp-hz,.sp-sun,.sp-low,.sp-dot{animation:none;transform:none}.sp-ray{animation:none;stroke-dashoffset:0}#splash{transition:opacity .3s}#splash.out{transform:none}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);z-index:20;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13.5px;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg viewBox="80 110 352 320">
  <defs><clipPath id="sp-c"><rect x="0" y="0" width="512" height="288"/></clipPath></defs>
  <g clip-path="url(#sp-c)"><circle class="sp-sun" cx="256" cy="288" r="112"/></g>
  <g class="sp-cr"><line class="sp-ray" style="animation-delay:0.82s" pathLength="1" x1="256.0" y1="142.0" x2="256.0" y2="106.0"/><line class="sp-ray" style="animation-delay:0.9s" pathLength="1" x1="345.9" y1="173.0" x2="368.1" y2="144.6"/><line class="sp-ray" style="animation-delay:0.9s" pathLength="1" x1="166.1" y1="173.0" x2="143.9" y2="144.6"/><line class="sp-ray" style="animation-delay:0.98s" pathLength="1" x1="396.3" y1="247.8" x2="430.9" y2="237.8"/><line class="sp-ray" style="animation-delay:0.98s" pathLength="1" x1="115.7" y1="247.8" x2="81.1" y2="237.8"/></g>
  <line class="sp-cr sp-hz" x1="96" y1="320" x2="416" y2="320"/>
  <line class="sp-cr sp-low" x1="176" y1="368" x2="336" y2="368"/>
  <circle class="sp-dot" cx="394" cy="368" r="22"/>
</svg></div>
<script>
(function () {
  var el = document.getElementById('splash'), off = false;
  try { off = localStorage.getItem('kyou.splash') === 'off'; } catch (e) {}
  if (off || (navigator.webdriver && !/[?&]splash\b/.test(location.search))) { el.remove(); return; }
  // a Home Screen app starts below the status bar: lift the animation so it sits in the middle of the whole screen
  var sa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches), gap = screen.height - window.innerHeight;
  if (sa && gap > 0 && gap < 120) el.style.paddingBottom = gap + 'px';
  // the strips above and below the page (status bar, home bar) show the page's own color: make them blue while it plays
  document.documentElement.style.background = document.body.style.background = '#4F8ED6';
  var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', '#4F8ED6');
})();
</script>
<div id="app"></div>

<script>
(() => {
'use strict';
/* ================= きょう：ひび手帳のタイムラインの「今日」だけ =================
   データはひび手帳が Google ドライブ（アプリ専用の場所）に自動保存している hibi.json を読むだけ。
   ここからは何も書き込まない（月表示・日記・編集はひび手帳で）。
   ログインはひび手帳と同じ、乗換案内の Worker（/hibi-auth/）を通す。 */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const P = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = P(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((P(b) - P(a)) / 864e5);
const todayISO = () => iso(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const WD = ['日', '月', '火', '水', '木', '金', '土'];
const wd = s => P(s).getDay();
const hhmm = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const hm = t => String(t || '').replace(/^0(\d)/, '$1');
const hmM = m => hm(hhmm(m));
const dur = m => m >= 60 ? `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : `${m}分`;
const md = s => { const d = P(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const evLen = ev => { const x = toMin(ev.end) - toMin(ev.start); return x > 0 ? x : x + 1440; };
const multiDay = ev => !ev.allDay && !!ev.endDate && ev.endDate > ev.date;
const overnight = ev => !ev.allDay && !multiDay(ev) && toMin(ev.end) <= toMin(ev.start);
const evSpan = ev => ev.endDate && ev.endDate > ev.date && (ev.allDay || ev.calOnly) ? diffDays(ev.date, ev.endDate) : 0;
const okColor = c => typeof c === 'string' && (/^#[0-9a-f]{3,8}$/i.test(c) || /^rgba?\([\d.,\s%]+\)$/i.test(c));
const COLORS = ['#E07F78','#E9A23B','#6B88B0','#86B067','#9B4F6E','#4FA39B','#A68BD2','#8E8E96'];
const col = c => okColor(c) ? c : COLORS[2];
const SCH_C = '#5B8FC9', TODO_C = '#E07F78';

/* ================= icons（ひび手帳と同じ） ================= */
const IC = {
  alarm:'<circle cx="12" cy="13" r="7"/><path d="M12 10v3l2 2M5 4 2.5 6.5M19 4l2.5 2.5"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  cup:'<path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M12 3v3"/>',

/* ================= storage ================= */
const GD_KEY = 'kyou.gd', DATA_KEY = 'kyou.data', HIBI_GD = 'hibi.gd', HIBI_DATA = 'hibi.v1';
const GD_API = 'https://www.googleapis.com/drive/v3/files';
const DEF_NORIKAE = 'https://norikae.gohanoishi.workers.dev';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
let gd = lsGet(GD_KEY) || {};
const gdPut = o => { gd = { ...gd, ...o }; lsSet(GD_KEY, gd); };
// only what the timeline needs is kept here (no diary, no photos)
let D = lsGet(DATA_KEY); // { S, at (when hibi.json was saved), got (when we read it), src }
const pick = s => ({
  events: Array.isArray(s.events) ? s.events : [],
  todos: Array.isArray(s.todos) ? s.todos : [],
  school: s.school && typeof s.school === 'object' ? s.school : {},
  settings: { holidays: !s.settings || s.settings.holidays !== false, theme: s.settings && s.settings.theme, accent: s.settings && s.settings.accent, norikae: s.settings && s.settings.norikae },
});
let S = D && D.S ? D.S : null;

// ひび手帳を同じ端末の Safari で使っているときは、その中身も読める（同じ github.io の中なので）
const hibiLocal = () => { const o = lsGet(HIBI_DATA); return o && Array.isArray(o.events) ? o : null; };

const norikaeBase = () => {
  let u = (gd.base || (S && S.settings.norikae) || (hibiLocal() || { settings: {} }).settings.norikae || DEF_NORIKAE).trim();
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return x.protocol === 'https:' ? (x.origin + x.pathname).replace(/\/+$/, '') : ''; } catch (e) { return ''; }
};
const authBase = () => { const b = norikaeBase(); return b ? b + '/hibi-auth' : ''; };

/* ================= Google login (read only) ================= */
function gdBorrow() {
  // ひび手帳がこの端末（同じ Safari）で Google にログイン済みなら、そのログインを使う（ひび手帳の記録は書き換えない）
  if (gd.rt || gd.noBorrow) return;
  const h = lsGet(HIBI_GD); if (h && h.rt) gdPut({ rt: h.rt, email: h.email || '', borrowed: true });
}
function gdLogin() {
  const b = authBase(); if (!b) { toast('乗換案内のURLが正しくありません（設定で直せます）'); return; }
  const s = Math.random().toString(36).slice(2, 12); try { localStorage.setItem(GD_KEY + '.s', s); } catch (e) {}
  location.href = `${b}/start?ret=${encodeURIComponent(location.origin + location.pathname)}&s=${s}${gd.email ? '&hint=' + encodeURIComponent(gd.email) : ''}`;
}
function gdFromHash() {
  const h = new URLSearchParams(location.hash.slice(1)); if (!h.has('gauth') && !h.has('gauth_err')) return;
  let s0 = ''; try { s0 = localStorage.getItem(GD_KEY + '.s') || ''; localStorage.removeItem(GD_KEY + '.s'); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  if (!s0 || h.get('s') !== s0) return;
  if (h.has('gauth_err')) { const e = h.get('gauth_err'); toast(e === 'access_denied' ? 'ログインを取りやめました' : 'Googleにログインできませんでした。もう一度お試しください'); return; }
  try {
    const p = JSON.parse(decodeURIComponent(escape(atob(h.get('gauth').replace(/-/g, '+').replace(/_/g, '/')))));
    if (!p.rt) throw new Error();
    gdPut({ rt: p.rt, at: p.at, exp: p.exp, email: p.email || '', fid: '', borrowed: false, noBorrow: false });
    toast(`${p.email || 'Google'} でログインしました`);
  } catch (e) { toast('Googleにログインできませんでした。もう一度お試しください'); }
}
async function gdToken() {
  if (gd.at && gd.exp - 60000 > Date.now()) return gd.at;
  const r = await fetch(authBase() + '/token', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ rt: gd.rt }) });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { gd = { email: gd.email, base: gd.base }; lsSet(GD_KEY, gd); throw new Error('revoked'); }
  if (!r.ok || !j.at) throw new Error('token');
  gdPut({ at: j.at, exp: j.exp }); return j.at;
}
async function gdFetch(url) {
  const go = async () => fetch(url, { headers: { authorization: 'Bearer ' + await gdToken() }, cache: 'no-store' });
  let r = await go();
  if (r.status === 401) { gdPut({ at: '', exp: 0 }); r = await go(); }
  if (r.status === 404) throw new Error('gone');
  if (!r.ok) throw new Error('drive ' + r.status);
  return r;
}
async function gdFind() {
  const u = `${GD_API}?spaces=appDataFolder&pageSize=10&fields=files(id,modifiedTime)&q=${encodeURIComponent("name='hibi.json'")}`;
  const f = ((await (await gdFetch(u)).json()).files || [])[0];
  if (!f) return null; gdPut({ fid: f.id }); return f;
}

/* ================= loading ================= */
let busy = false, err = '';
async function load(manual) {
  if (busy) return; gdBorrow();
  if (!gd.rt) {
    // not logged in: use ひび手帳 on this same Safari if it is here
    const h = hibiLocal();
    if (h) { setData(h, 0, 'local'); err = ''; } else if (manual) toast('Googleでログインすると、ひび手帳の予定を読み込めます');
    render(); return;
  }
  busy = true; err = ''; render();
  try {
    let f = gd.fid ? { id: gd.fid } : await gdFind();
    if (!f) { err = 'ドライブにひび手帳のデータがまだありません。ひび手帳の設定で「Googleドライブに自動保存」をオンにしてください'; return; }
    // modifiedTime first: when nothing changed, skip the download
    let meta;
    try { meta = await (await gdFetch(`${GD_API}/${f.id}?fields=id,modifiedTime`)).json(); }
    catch (e) { if (e.message !== 'gone') throw e; f = await gdFind(); if (!f) { err = 'ドライブにひび手帳のデータが見つかりません'; return; } meta = f; }
    const at = Date.parse(meta.modifiedTime) || Date.now();
    if (!manual && D && D.src === 'drive' && D.at === at) { D.got = Date.now(); lsSet(DATA_KEY, D); return; }
    const o = await (await gdFetch(`${GD_API}/${meta.id}?alt=media`)).json();
    const s = o && o.data ? o.data : o;
    if (!s || !Array.isArray(s.events)) throw new Error('shape');
    setData(s, at, 'drive');
    if (manual) toast('最新の予定を読み込みました');
  } catch (e) {
    err = e.message === 'revoked' ? 'Googleのログインが切れました。もう一度ログインしてください'
      : navigator.onLine === false ? 'オフラインです。前に読み込んだ予定を表示しています'
      : e.message === 'token' ? 'ログインの確認ができませんでした（乗換案内のURLを確かめてください）'
      : '読み込めませんでした。少ししてからもう一度お試しください';
    if (manual) toast(err);
  } finally { busy = false; applyTheme(); render(); }
}
function setData(s, at, src) {
  S = pick(s); D = { S, at, got: Date.now(), src };
  if (!lsSet(DATA_KEY, D)) { try { localStorage.removeItem(DATA_KEY); } catch (e) {} }
  applyTheme();
}

/* ================= holidays（ひび手帳と同じ計算） ================= */
const holCache = {};
function holidays(y) {
  if (holCache[y]) return holCache[y];
  const h = new Map();
  const add = (m, d, n) => h.set(`${y}-${pad(m)}-${pad(d)}`, n);
  const nthMon = (m, n) => { const f = new Date(y, m - 1, 1); return iso(new Date(y, m - 1, 1 + (8 - f.getDay()) % 7 + 7 * (n - 1))); };
  const k = Math.floor((y - 1980) / 4);
  add(1, 1, '元日'); h.set(nthMon(1, 2), '成人の日'); add(2, 11, '建国記念の日');
  if (y >= 2020) add(2, 23, '天皇誕生日'); else if (y <= 2018) add(12, 23, '天皇誕生日');
  add(3, Math.floor(20.8431 + 0.242194 * (y - 1980) - k), '春分の日');
  add(4, 29, '昭和の日'); add(5, 3, '憲法記念日'); add(5, 4, 'みどりの日'); add(5, 5, 'こどもの日');
  if (y === 2020) { add(7, 23, '海の日'); add(7, 24, 'スポーツの日'); add(8, 10, '山の日'); }
  else if (y === 2021) { add(7, 22, '海の日'); add(7, 23, 'スポーツの日'); add(8, 8, '山の日'); }
  else { h.set(nthMon(7, 3), '海の日'); if (y >= 2016) add(8, 11, '山の日'); }
  if (y === 2019) { add(5, 1, '天皇の即位の日'); add(10, 22, '即位礼正殿の儀'); }
  h.set(nthMon(9, 3), '敬老の日');
  add(9, Math.floor(23.2488 + 0.242194 * (y - 1980) - k), '秋分の日');
  if (y !== 2020 && y !== 2021) h.set(nthMon(10, 2), y >= 2020 ? 'スポーツの日' : '体育の日'); add(11, 3, '文化の日'); add(11, 23, '勤労感謝の日');
  for (const d of [...h.keys()]) { const mid = addDays(d, 1); if (h.has(addDays(d, 2)) && !h.has(mid) && wd(mid) !== 0) h.set(mid, '国民の休日'); }
  for (const d of [...h.keys()].sort()) if (wd(d) === 0) { let n = addDays(d, 1); while (h.has(n)) n = addDays(n, 1); h.set(n, '振替休日'); }
  return (holCache[y] = h);
}

/* ================= events（繰り返し・授業はひび手帳と同じ決まりで） ================= */
function matches(ev, d) {
  if (ev.skip && ev.skip[d]) return false;
  if (ev.until && d > ev.until) return false;
  switch (ev.repeat) {
    case 'daily': return !(ev.every > 1) || diffDays(ev.date, d) % ev.every === 0;
