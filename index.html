<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="まいにち">
<meta name="theme-color" content="#F5EFEB">
<meta name="description" content="ひび手帳の今日の予定と、ひび手帳のことを話せるAI">
<title>まいにち｜ひび手帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* ひび手帳と同じ色で、テーマカラーはひび手帳のブルー。Structured のように、色つきのカプセルを縦の線でつないで1日を並べる */
:root{
  --bg:#F5EFEB; --surface:#FFFFFF; --surface-2:#FAF6F3; --ink:#232A5C; --ink-2:#6D7092; --ink-3:#A9AABD;
  --line:#E2D9D2; --sep-strong:rgba(0,0,0,.16); --accent:#4F8ED6; --sun:#D45850; --overlay:rgba(24,26,48,.32); --shadow:0 6px 22px rgba(35,42,92,.08);
  --f-body:ui-rounded,"SF Pro Rounded","Hiragino Sans","Zen Maru Gothic","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#252526; --surface-2:#1C1C1D; --ink:#F2F1F4; --ink-2:#BDBDC6; --ink-3:#A0A0AA;
    --line:#3A3A3F; --sep-strong:rgba(255,255,255,.2); --accent:#6FA8E8; --sun:#F07D74; --overlay:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#252526; --surface-2:#1C1C1D; --ink:#F2F1F4; --ink-2:#BDBDC6; --ink-3:#A0A0AA;
  --line:#3A3A3F; --sep-strong:rgba(255,255,255,.2); --accent:#6FA8E8; --sun:#F07D74; --overlay:rgba(0,0,0,.6); --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink)}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
@media (hover:none){button:not(:disabled):not(.tb):active{opacity:.55}}

#app,.page{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 16px calc(env(safe-area-inset-bottom,0px) + 110px)}

/* header */
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.hd .d{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.hd h1{margin:0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:.01em}
.hd .hol{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:var(--sun);vertical-align:3px}
.hd-btns{display:flex;gap:2px;margin-top:4px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.icon-btn.spin .ico{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sum{display:flex;align-items:center;gap:12px;margin:10px 0 16px;padding:12px 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.ring{flex:none;width:44px;height:44px}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.sum b{display:block;font-size:15px}
.sum small{display:block;font-size:12.5px;color:var(--ink-2)}

/* all-day chips */
.ad{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{display:flex;align-items:center;gap:7px;max-width:100%;padding:5px 12px 5px 5px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.chip .c{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.chip .c .ico{width:15px;height:15px;stroke-width:2.1}
.chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.over{color:var(--sun)}

/* timeline */
.tl{position:relative}
.row{position:relative;display:grid;grid-template-columns:52px 64px minmax(0,1fr);align-items:center;column-gap:6px;padding:0}
.row .t{align-self:start;padding:6px 4px 0 0;text-align:right;font-size:12px;font-weight:600;color:var(--ink-2);line-height:1.25}
.rail{position:relative;align-self:stretch;display:flex;justify-content:center;align-items:flex-start}
/* the line joining the items: each item's own color, fading into the next one's between them */
/* Structured-style links (same as ひび手帳): dotted, centred on the pills, fading from one item's color into the next (drawn by drawLinks) */
.tl-links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
.tl-links .tl-near{stroke:color-mix(in srgb,var(--ink-3) 55%,var(--surface))}
.row.it{padding:6px 0}
.row.it .rail{align-items:center}
.pill{position:relative;z-index:1;width:58px;border-radius:29px;background:color-mix(in srgb,var(--c) 84%,#fff);color:#fff;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 3px 10px color-mix(in srgb,var(--c) 35%,transparent)}
.pill .ico{position:relative;z-index:1;width:26px;height:26px;stroke-width:2}
/* 同じ作り（ひび手帳のタイムラインと同じ）：始まっていない予定は灰色の丸にアイコンだけ色、始まった予定は色つき */
.row.it.future .pill{background:#E6E0DA;color:var(--c);box-shadow:none;filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row.it.future .pill{background:#3D3D3F}}
:root[data-theme="dark"] .row.it.future .pill{background:#3D3D3F}
/* now inside this item: the part still to come is paler */
.pill .rest{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.5)}
.body{display:block;min-width:0;padding:4px 0}
.body .m{display:block;font-size:12.5px;color:var(--ink-2)}
.body .tt{display:block;font-size:17px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.row.done .tt{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-3)}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:2px;background:var(--surface-2);color:var(--ink-2)}
.tag.now{background:var(--accent);color:#fff}
.tag.pend{background:none;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row.it.pending .pill{opacity:.6;box-shadow:none}
.tag.rt{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.tag .ico{display:inline-block;width:11px;height:11px;stroke-width:2.4;vertical-align:-1px;margin-right:2px}
/* free time between items */
.row.gap .body{font-size:12px;color:var(--ink-3);padding:6px 0}
/* the now line */
.row.now{padding:2px 0}
.row.now .t{padding-top:0;align-self:center;color:var(--accent);font-weight:700}
.row.now .dot{position:relative;z-index:1;width:12px;height:12px;border-radius:50%;background:var(--accent);margin:auto;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.row.now .rail{align-items:center}
.row.now .ln{grid-column:3/-1;height:2px;border-radius:1px;background:var(--accent)}
.empty{text-align:center;color:var(--ink-2);padding:44px 12px;line-height:1.8}
.empty .ico{width:40px;height:40px;margin:0 auto 10px;color:var(--ink-3)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--ink-3)}
.foot.err{color:var(--sun)}

/* first screen (not connected yet) */
.hello{padding:30px 6px;text-align:center}
.hello .logo{width:84px;height:84px;border-radius:22px;margin:10px auto 18px;box-shadow:var(--shadow)}
.hello h2{margin:0 0 8px;font-size:22px}
.hello p{margin:0 0 20px;color:var(--ink-2);font-size:14px;line-height:1.8}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:14px;font-weight:700;background:var(--surface);box-shadow:var(--shadow);margin-top:10px}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:none;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.7;text-align:left}

/* bottom sheet */
.ov{position:fixed;inset:0;z-index:10;background:var(--overlay);opacity:0;transition:opacity .25s}
.ov.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:86vh;overflow-y:auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sh-bar{display:flex;justify-content:flex-end;padding:12px 14px 0}
.sh-bar button{font-weight:700;color:var(--accent);padding:4px 6px}
.sh-in{padding:0 18px}
.dt-head{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.dt-head .pill{width:56px;height:56px;border-radius:28px;flex:none}
.dt-head .pill .ico{width:26px;height:26px}
.dt-head b{display:block;font-size:20px;line-height:1.35;overflow-wrap:anywhere}
.dt-head small{display:block;color:var(--ink-2);font-size:13.5px}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:4px 14px;margin-bottom:12px}
.li{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.li:last-child{border-bottom:0}
.li>.ico{flex:none;width:20px;height:20px;color:var(--ink-2);margin-top:1px}
.li span{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.li.on{color:var(--ink-3);text-decoration:line-through}
.li .box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--c);display:grid;place-items:center;color:#fff;margin-top:1px}
.li .box .ico{width:13px;height:13px;stroke-width:3}
.li.on .box{background:var(--c)}
.li:not(.on) .box .ico{display:none}
.lbl{font-size:12px;font-weight:700;color:var(--ink-2);margin:16px 4px 6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;font-size:14.5px;font-weight:600}
.tg small{display:block;font-size:12px;font-weight:400;color:var(--ink-2);margin-top:2px}
.tg input{flex:none;width:22px;height:22px;accent-color:var(--accent)}
.fld input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}

.rt-sum{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.rt-sum .od{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;flex-wrap:wrap}
.rt-sum .od .ico{width:18px;height:18px;color:var(--ink-3)}
.rt-sum .tm{font-size:32px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.rt-sum .mt{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px}
.rt-tags{display:flex;gap:6px;margin-top:8px}
.rt-tags span{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;color:#fff;background:var(--c)}
.rt-steps{list-style:none;margin:0;padding:6px 16px;background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.rt-steps li{display:grid;grid-template-columns:48px 18px minmax(0,1fr);gap:10px;align-items:stretch}
.rt-steps .t{font-size:12.5px;text-align:right;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center;line-height:1.35}
.rt-steps .t b{font-size:14.5px;color:var(--ink)}
.rt-steps .mk{position:relative;display:flex;justify-content:center}
.rt-steps .st .mk::after{content:"";align-self:center;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);z-index:1}
.rt-steps .st.first .mk::after,.rt-steps .st.last .mk::after{border-color:var(--accent);background:var(--accent)}
.rt-steps .st .nm{font-size:16px;font-weight:700;padding:12px 0;align-self:center}
.rt-steps .ac .mk::before{content:"";width:6px;border-radius:3px;background:var(--c,var(--accent))}
.rt-steps .ac.walk .mk::before{width:0;border-left:4px dotted var(--ink-3);background:none}
.rt-steps .ac .bd{padding:6px 0 10px;font-size:13px;color:var(--ink-2)}
.rt-steps .ac .ln{font-size:14px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
.rt-steps .ac .ln::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.rt-steps .ac.walk .ln::before{display:none}
.rt-steps details{margin-top:4px}
.rt-steps summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px}
.rt-steps details ul{list-style:none;padding:0;margin:4px 0 0}
.rt-steps details li{display:flex;gap:10px;font-size:12.5px;padding:2px 0}
/* launch animation: the icon's sunrise plays on the blue, then the app shows (like ひび手帳's "h") */
/* launch animation 「夜明け」: the screen turns from night navy to the morning blue, the stars fade as the icon's sun rises */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;overflow:hidden;background:#4F8ED6;animation:spDawn 1.3s ease .15s both;transition:opacity .45s ease,transform .5s cubic-bezier(.3,.8,.3,1)}
@keyframes spDawn{from{background-color:#141A3D}to{background-color:#4F8ED6}}
/* everything waits on the night sky until the first frame is really on the screen (the app's script runs before the first paint) */
#splash:not(.go),#splash:not(.go) *{animation-play-state:paused!important}
#splash svg{width:min(60vw,270px);height:auto;overflow:visible}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-star{position:absolute;width:var(--s,3px);height:var(--s,3px);border-radius:50%;background:#FFF4EE;box-shadow:0 0 6px rgba(255,244,238,.8);opacity:0;animation:spTwinkle 1.25s ease forwards}
@keyframes spTwinkle{0%{opacity:0}25%{opacity:.95}70%{opacity:.6}100%{opacity:0}}
.sp-cr{stroke:#FFF4EE;stroke-width:20;stroke-linecap:round;fill:none}
.sp-hz{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:spGrow .6s cubic-bezier(.5,0,.2,1) .2s forwards}
.sp-sun{fill:#FFF4EE;transform:translateY(150px);animation:spRise 1s cubic-bezier(.25,.8,.25,1) .45s forwards}
.sp-halo{opacity:0;animation:spHalo 1.4s ease .5s forwards}
@keyframes spHalo{0%{opacity:0}50%{opacity:.9}100%{opacity:0}}
/* hidden until it starts drawing: Safari paints the round end of a line that is not drawn yet as a dot */
.sp-ray{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:spDraw .3s ease-out forwards}
.sp-low{opacity:.55;transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:spGrow .35s cubic-bezier(.5,0,.2,1) 1.35s forwards}
.sp-dot{fill:#232A5C;transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spDot .45s cubic-bezier(.3,1.7,.5,1) 1.55s forwards}
@keyframes spGrow{to{transform:scaleX(1)}}
@keyframes spRise{to{transform:none}}
@keyframes spDraw{0%{stroke-dashoffset:1;opacity:1}100%{stroke-dashoffset:0;opacity:1}}
@keyframes spDot{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#splash{animation:none}.sp-star,.sp-halo{display:none}.sp-hz,.sp-sun,.sp-low,.sp-dot{animation:none;transform:none}.sp-ray{animation:none;stroke-dashoffset:0;opacity:1}#splash{transition:opacity .3s}#splash.out{transform:none}}
/* bottom bar (from communication) */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;padding:0 12px max(10px,env(safe-area-inset-bottom));pointer-events:none}
/* two tabs only: the bar is two tabs wide (same as iti) */
#tabbar ul{pointer-events:auto;position:relative;display:flex;height:62px;width:200px;margin:0;padding:4px;list-style:none;border-radius:31px;
  background:color-mix(in srgb,var(--bg) 58%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transform:translateZ(0);
  box-shadow:0 8px 32px rgba(0,0,0,.14),inset 0 0 0 .5px var(--sep-strong),inset 0 1px 0 rgba(255,255,255,.35)}
.tb-hl{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 2);pointer-events:none;transition:transform 620ms cubic-bezier(.34,1.45,.5,1)}
.tb-hl>span{display:block;width:100%;height:100%;border-radius:999px;background:color-mix(in srgb,var(--ink) 10%,transparent);box-shadow:inset 0 0 0 .5px var(--sep-strong)}
.tb-hl>span.jelly{animation:jelly 560ms cubic-bezier(.3,.9,.4,1) both}
@keyframes jelly{0%{transform:scale(1,1)}28%{transform:scale(1.32,.84)}58%{transform:scale(.94,1.1)}80%{transform:scale(1.03,.98)}100%{transform:scale(1,1)}}
#tabbar li{position:relative;flex:1;min-width:0}
.tb{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:999px;font-size:10px;font-weight:700;color:var(--ink-3);transition:color .2s,transform .2s}
.tb:active{transform:scale(.9)}
.tb[aria-current="page"]{color:var(--ink)}
.tb .ico{width:22px;height:22px;stroke-width:1.8}
.tb[aria-current="page"] .ico{stroke-width:2.3}

/* AI */
.ai-card{display:flex;gap:12px;align-items:flex-start;margin:10px 0 16px;padding:14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.ai-card>.ico{flex:none;width:26px;height:26px;color:var(--accent);margin-top:1px}
.ai-card b{display:block;font-size:15px}
.ai-card p{margin:3px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.ai-card .btn{margin-top:10px;padding:11px}
.ai-card .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.ai-card .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.ai-card.slim{padding:9px 14px;align-items:center}
.ai-card.slim>.ico{width:20px;height:20px;margin:0}
.ai-card.slim b{font-size:13px;font-weight:600;color:var(--ink-2)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.sugg button{padding:8px 13px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px;font-weight:600}
.msgs{display:flex;flex-direction:column;gap:10px;padding-bottom:84px}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.ai.wait{color:var(--ink-3)}
.msg.ai.err{color:var(--sun)}
.msg .src{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;white-space:normal}
.msg .src span{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.msg.asking{width:86%;white-space:normal}
.cf b{display:block;font-size:15px;margin-bottom:8px}
.cf label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin-top:8px}
.cf .inp{display:block;width:100%;margin-top:4px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;color:var(--ink)}
/* iPhone gives date / time fields their own minimum width: without this they stick out of the card */
.cf input[type="date"].inp,.cf input[type="time"].inp{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:44px;text-align:left}
.cf input[type="date"]::-webkit-date-and-time-value,.cf input[type="time"]::-webkit-date-and-time-value{text-align:left;margin:0}
.msg.asking .cf{min-width:0;overflow:hidden}
.cf .cf-ad{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.cf .cf-ad input{flex:none;width:20px;height:20px;accent-color:var(--accent)}
.cf .cf-sub{margin:5px 2px 0;font-size:11.5px;color:var(--ink-3)}
.seg{display:flex;gap:4px;margin-top:4px;padding:3px;border-radius:12px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{flex:1;min-width:0;padding:8px 2px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink-2);text-align:center;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--accent);color:#fff}
.cf-tm{display:flex;align-items:center;gap:8px;margin-top:8px}
.cf-tm .inp{margin:0;min-width:0;flex:1}
.cf-btns{display:flex;gap:8px;margin-top:12px}
.cf-btns .btn{margin:0;padding:11px}
.cf p{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
.msg.rt{width:92%;max-width:92%;white-space:pre-wrap}
.rtc{white-space:normal;margin-top:10px;padding:12px;border-radius:16px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.rtc.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.rtc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rtc-h b{font-size:19px;font-weight:800;margin-right:4px}
.rtc-h i{font-style:normal;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:#8B8FA8}
.rtc-h .tg-早{background:#E9776F}.rtc-h .tg-安{background:#5BB07A}.rtc-h .tg-楽{background:#4AA3C8}
.rtc-m{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.rtc-l{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rtc-l span{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.rtc details{margin-top:8px}
.rtc summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px}
.rtc .rt-steps{box-shadow:none;background:var(--surface);margin-top:6px;padding:4px 10px}
.rtc .rt-steps .st .nm{font-size:14px;padding:8px 0}
.rtc-b{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.rtc-b .btn{flex:1;min-width:0;margin:0;padding:10px;font-size:13px}
.msg .tool{display:block;font-size:11.5px;color:var(--ink-3);margin-bottom:4px}
.composer{position:fixed;left:0;right:0;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 70px);z-index:7;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.composer form{pointer-events:auto;display:flex;align-items:flex-end;gap:8px;width:min(28rem,calc(100vw - 1.5rem));padding:6px 6px 6px 16px;border-radius:26px;
  background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 6px 24px rgba(0,0,0,.12),inset 0 0 0 .5px var(--sep-strong)}
.composer textarea{flex:1;min-width:0;border:0;background:none;resize:none;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);padding:8px 0;max-height:120px;outline:none}
.composer .send{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}
.composer .send .ico{width:20px;height:20px;stroke-width:2.4}
.composer .send:disabled{opacity:.35}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:20;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);padding:10px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:13.5px;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

(function () {
  var el = document.getElementById('splash'), off = false;
  try { off = localStorage.getItem('kyou.splash') === 'off'; } catch (e) {}
  if (off || (navigator.webdriver && !/[?&]splash\b/.test(location.search))) { el.remove(); return; }
  // a Home Screen app starts below the status bar: lift the animation so it sits in the middle of the whole screen
  var sa = navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches), gap = screen.height - window.innerHeight;
  if (sa && gap > 0 && gap < 120) el.style.paddingBottom = gap + 'px';
  // the strips above and below the page (status bar, home bar) show the page's own color: make them blue while it plays
  var night = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), html = document.documentElement, body = document.body;
  html.style.background = body.style.background = night ? '#141A3D' : '#4F8ED6';
  var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', night ? '#141A3D' : '#4F8ED6');
  // start when the first frame is painted: two frames later, so the night sky is seen from its beginning
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    el.classList.add('go'); window.__spAt = performance.now();
    if (!night) return;
    html.style.transition = body.style.transition = 'background-color 1.3s ease .15s'; html.style.background = body.style.background = '#4F8ED6';
    setTimeout(function () { if (mt && document.getElementById('splash')) mt.setAttribute('content', '#4F8ED6'); }, 800);
  }); });
})();
</script>

  return `<div class="rtc${sel ? ' sel' : ''}">
    <div class="rtc-h"><b class="num">${m.rt.routes.length > 1 ? '①②③④⑤⑥'[i] + ' ' : ''}${esc(hm(r.dep))} → ${esc(hm(r.arr))}</b>${(r.tags || []).map(t => `<i class="tg-${esc(t)}">${esc(t)}</i>`).join('')}</div>
    <div class="rtc-m num">${[esc(String(r.duration || '').replace(/\(.*\)$/, '')), r.transfers != null ? `乗換${r.transfers}回` : '', r.fare != null ? `${r.fareNote === '目安' ? '約' : ''}${Number(r.fare).toLocaleString()}円` : ''].filter(Boolean).join('・')}</div>
    <div class="rtc-l">${rides.filter(x => !x.walk).map(x => `<span style="--c:${/^#[0-9a-f]{3,8}$/i.test(x.color) ? x.color : 'var(--accent)'}">${esc(x.line)}</span>`).join('')}</div>
    <details><summary>駅と電車を見る</summary><ol class="rt-steps">${steps}</ol></details>
    <div class="rtc-b"><button class="btn ${added ? 'ghost' : 'primary'}" data-act="rtAdd" data-m="${mi}" data-i="${i}" ${added ? 'disabled' : ''}>${added ? '追加しました（ひび手帳を開くと入ります）' : 'ひび手帳に追加'}</button>${m.rt.routes.length > 1 ? `<button class="btn ghost" data-act="rtSel" data-m="${mi}" data-i="${i}">${sel ? 'この経路で話しています' : 'この経路で話す'}</button>` : ''}</div></div>`;
}
// the answer's own list of routes is shown as cards instead
const routeText = t => String(t || '').split('\n').filter(l => !/^[①②③④⑤⑥]|^　|^\d{1,2}:\d{2}発/.test(l)).join('\n').trim();
const msgHTML = (m, mi) => m.rt ? `<div class="msg ai rt">${m.tool ? `<span class="tool">${esc(m.tool)}</span>` : ''}${esc(routeText(m.text))}${m.rt.routes.map((r, i) => routeCardHTML(m, mi, r, i)).join('')}</div>` : `<div class="msg ${m.who}${m.wait ? ' wait' : ''}${m.err ? ' err' : ''}${m.confirm ? ' asking' : ''}">${m.tool ? `<span class="tool">${esc(m.tool)}</span>` : ''}${m.confirm ? confirmHTML(m.confirm) : esc(m.text || (m.wait ? '考えています…' : ''))}${(m.src || []).length ? `<span class="src">${m.src.map(c => `<span>${esc(c)}</span>`).join('')}</span>` : ''}</div>`;
function aiPaintMsgs(stick) {
  const el = $('#ai-msgs'); if (!el) return;
  el.innerHTML = AIV.msgs.map((m, i) => msgHTML(m, i)).join('');
  $('#ai-sugg').hidden = AIV.msgs.length > 0;
  const send = $('#ai-send'); if (send) { send.innerHTML = ico(AIV.busy ? 'stop' : 'up'); send.setAttribute('aria-label', AIV.busy ? '止める' : '送る'); }
  if (stick) scrollTo(0, document.documentElement.scrollHeight);
}
function aiOpen() {
  const el = $('#ai');
  if (!el.firstChild) {
    el.innerHTML = `<div class="hd"><div><div class="d">ひび手帳のことを聞けます</div><h1>AI</h1></div>
      <div class="hd-btns">${icoBtn('aiNew', 'plus', '新しい会話')}${icoBtn('settings', 'gear', '設定')}</div></div>
      <div id="ai-card"></div>
      <div class="sugg" id="ai-sugg">${SUGG.map(q => `<button data-act="aiAsk" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
      <div class="msgs" id="ai-msgs"></div>
      <div class="composer"><form id="ai-form"><textarea id="ai-q" rows="1" placeholder="ひび手帳のことを聞く" enterkeyhint="send"></textarea><button class="send" id="ai-send" type="submit" aria-label="送る">${ico('up')}</button></form></div>`;
    const q = $('#ai-q');
    q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(120, q.scrollHeight) + 'px'; });
    q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#ai-form').requestSubmit(); } });
    $('#ai-form').addEventListener('submit', e => { e.preventDefault(); if (AIV.busy) { if (AIV.engine) AIV.engine.stop(); return; } const v = q.value.trim(); if (!v) return; q.value = ''; q.style.height = 'auto'; aiAsk(v); });
  }
  aiPaintCard(); aiPaintMsgs(true);
  aiBoot().then(() => { aiPaintCard(); aiPaintMsgs(true); }, () => aiPaintCard());
}
const TOOL_JA = { hibi_news: '凪から取ってきました', hibi_baseball: '野球速報から取ってきました', hibi_weather: '天気を調べました', hibi_route: 'のりかえで調べました', hibi_route_change: 'のりかえで経路を変えました', hibi_add_event: 'ひび手帳への追加', hibi_money: '家計簿を計算しました', hibi_habits: '習慣の記録を数えました', hibi_attendance: '出席を数えました', hibi_schedule: '予定を確認しました', hibi_next: '次の予定を確認しました', hibi_free_time: '空き時間を計算しました', hibi_todos: 'やることを確認しました' };
async function aiAsk(q) {
  if (AIV.busy) return;
  AIV.busy = true;
  const me = { who: 'me', text: q }, a = { who: 'ai', text: '', wait: true };
  AIV.msgs.push(me, a); aiPaintMsgs(true);
  try {
    const e = await aiBoot();
    if (!S) throw Object.assign(new Error(), { code: 'NO_DATA' });
    // a short follow-up (「あ、4月から10月ね」) that cannot be answered alone: ask it together with the last question one of
    // ひび手帳's exact tools answered (its own period first), instead of letting the small model guess the numbers
    // (not when the follow-up brings its own subject: 「昨日の日記は？」 is a new question, not a follow-up)
    let ask = q;
    if (e.hibiRoutes(q)) AIV.base = q;
    // and only when it is about nothing but a period: 「あ、4月から10月ね」「じゃあ先月は？」「6月だと？」「明日は？」
    // (「今日のニュースは？」「ありがとう」are new questions, not follow-ups)
    else if (AIV.base && isFollowUp(q)) { const c = q + AIV.mod.FOLLOW + AIV.base; if (e.hibiRoutes(c)) ask = c; }
    // always look through ひび手帳's records (the engine's own guess of 'is this about my records?' misses 習慣・家計簿・場所…)
    for await (const ev of e.streamEvents(ask, { useMemory: true, confirmTool: call => aiConfirm(a, call) })) {
      if (ev.type === 'tool_call') a.tool = TOOL_JA[ev.call.name] || 'ひび手帳を調べました';
      else if (ev.type === 'sources') a.src = ev.citations.slice(0, 6).map(c => `${md(c.date)} ${c.type === 'diary' ? '日記' : c.type === 'event' ? '予定' : c.type === 'task' ? 'やること' : 'メモ'}`);
      else if (ev.type === 'answer') { a.wait = false; a.text += ev.text; }
      else if (ev.type === 'tool_result' && ev.result.name === 'hibi_add_event') a.tool = ev.result.ok ? 'ひび手帳に渡しました' : 'ひび手帳への追加';
      // routes: shown as cards (and remembered, so they can be changed by talking)
      else if (ev.type === 'tool_result' && /^hibi_route/.test(ev.result.name) && ev.result.ok) { AIV.rt = ev.result.value; AIV.rtSel = 0; lsSet('mainichi.rt', AIV.rt); a.rt = ev.result.value; a.rtAdded = []; }
      aiPaintMsgs(true);
    }
    if (!a.text) { a.wait = false; a.text = '（止めました）'; }
  } catch (err) {
    a.wait = false; a.err = true; a.src = [];
    a.text = err && err.code === 'NO_DATA' ? 'ひび手帳のデータがまだ読み込まれていません。「今日」の画面で Google にログインしてください。'
      : err && err.code === 'MODEL_NOT_LOADED' ? 'この質問に答えるには、上の「AIを準備する」でAIをダウンロードしてください。（予定・次の予定・空き時間・やることは、準備しなくても答えられます）'
      : err && err.code === 'ABORTED' ? '（止めました）'
      : `答えられませんでした（${(err && err.message) || err}）`;
  } finally {
    AIV.busy = false; aiPaintMsgs(true);
    try { const id = AIV.engine && AIV.engine.chat.current(); if (id) localStorage.setItem(CONV_KEY, id); } catch (err) {}
  }
}
Object.assign(ACT, {
  tab: t => setTab(t.dataset.tab),
  aiAsk: t => aiAsk(t.dataset.q),
  aiLoad: () => aiLoad(false),
  aiForce: () => aiLoad(true),
  aiYes: () => {
    const m = AIV.msgs.find(x => x.confirm); if (!m) return;
    const v = id => ($('#' + id) || {}).value || '', title = v('cf-title').trim(), date = v('cf-date'), allDay = !!($('#cf-allday') || {}).checked, start = v('cf-start'), end = v('cf-end');
    if (!title) { toast('名前を入れてください'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('日付を選んでください'); return; }
    if (!allDay && (!/^\d{2}:\d{2}$/.test(start) || !/^\d{2}:\d{2}$/.test(end))) { toast('時刻を選んでください'); return; }
    const args = m.confirm.args, show = args.show === 'cal' || args.show === 'tl' ? args.show : 'both';
    Object.assign(args, { title, date, allDay, show, countdown: !!($('#cf-cd') || {}).checked }); if (allDay) { delete args.start; delete args.end; } else Object.assign(args, { start, end });
    const r = m.confirm.resolve; m.confirm = null; m.wait = true; aiPaintMsgs(); r(true);
  },
  cfShow: t => {
    const m = AIV.msgs.find(x => x.confirm); if (!m) return; const a = m.confirm.args, k = t.dataset.k;
    a.show = k; const sub = $('#cf-show'); if (sub) sub.textContent = SHOW_JA[k]; document.querySelectorAll('.seg [data-act=cfShow]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.k === k)));
  },
  rtAdd: async t => {
    const m = AIV.msgs[+t.dataset.m], i = +t.dataset.i, r = m && m.rt && m.rt.routes[i]; if (!r) return;
    t.disabled = true;
    try { await addRouteToHibi(r); (m.rtAdded = m.rtAdded || []).push(i); toast(`${hm(r.dep)}〜 の経路をひび手帳に渡しました`); }
    catch (e) { toast(e.message || '追加できませんでした'); }
    aiPaintMsgs();
  },
  // 「この経路で話す」: what is said next changes this one
  rtSel: t => { const m = AIV.msgs[+t.dataset.m]; if (!m || !m.rt) return; AIV.rt = m.rt; AIV.rtSel = +t.dataset.i; lsSet('mainichi.rt', AIV.rt); aiPaintMsgs(); },
  aiNo: () => { const m = AIV.msgs.find(x => x.confirm); if (!m) return; const r = m.confirm.resolve; m.confirm = null; m.wait = true; aiPaintMsgs(); r(false); },
  aiNew: async () => { if (AIV.busy) return; AIV.base = null; if (AIV.engine) await AIV.engine.chat.new(); AIV.msgs = []; try { localStorage.removeItem(CONV_KEY); } catch (e) {} aiPaintMsgs(); },
  aiDelete: async () => {
    if (!AIV.engine || !AIV.model) return;
    if (!confirm('ダウンロードしたAIを、この端末から削除しますか？（約1GB空きます。また使うときは、ダウンロードし直します）')) return;
    await AIV.engine.models.deleteCache(AIV.model.id).catch(() => {}); closeSheet(); aiPaintCard(); toast('AIを削除しました');
  },
});

function endSplash() {
  const el = $('#splash'); if (!el || el.classList.contains('out')) return; el.classList.add('out');
  document.documentElement.style.transition = document.body.style.transition = '';
  document.documentElement.style.background = document.body.style.background = ''; applyTheme(); // back to the app's own color
  setTimeout(() => el.remove(), 520);
}
if ($('#splash')) {
  // ends 1.95 s after it really started (see the splash's own script), whenever the app's script is done
  const quick = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches, len = quick ? 700 : 1950;
  const arm = () => window.__spAt ? setTimeout(endSplash, Math.max(0, len - (performance.now() - window.__spAt))) : requestAnimationFrame(arm);
  arm(); $('#splash').addEventListener('click', endSplash);
}
gdFromHash(); applyTheme(); render(); paintTabs(false); if (tab === 'ai') aiOpen(); load();
// keep the now line moving, and pick up a new day after midnight
let lastDay = todayISO();
setInterval(() => { if (document.visibilityState === 'visible' && !sheet && tab === 'today') render(); if (todayISO() !== lastDay) { lastDay = todayISO(); load(); } }, 30000);
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 120000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  render(); load();
});
addEventListener('pageshow', e => { if (e.persisted) load(); });
addEventListener('focus', () => load());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
